[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "md-nugget-notifier"
version = "0.1.0"
description = "Pick a random Markdown note and push it as a native desktop notification"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "md-nugget-notifier author" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
cross-platform = ["plyer>=2.1.0"]
dev = ["pytest>=7.0.0"]

[project.scripts]
md-nugget-notifier = "md_nugget_notifier.cli:main"
